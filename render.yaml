services:
  - type: web
    name: rhino
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      # --- secrets: values must be entered in the Render dashboard, never
      # committed here. sync: false just declares that the var exists and
      # blocks deploy until it's set, without storing a value in git.
      - key: DATABASE_URL
        sync: false
      - key: RHINO_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: RHINO_SESSION_SECRET
        sync: false
      # --- non-secret config ---
      # Set to this service's actual onrender.com URL (or custom domain)
      # after the first deploy — needed for the Google OAuth redirect and
      # for backend/handlers_oauth.go's callback URL construction.
      - key: RHINO_PUBLIC_URL
        sync: false
      # Render terminates TLS at its edge and proxies plain HTTP to the
      # container (matches serve.go running with no --tls-cert/--tls-key
      # here) — the session cookie's Secure flag still needs to be on
      # since the browser only ever sees the https:// URL.
      - key: RHINO_SESSION_SECURE
        value: "1"
      # Path to the OAuth client_secret.json — see the Secret Files step
      # in the deployment notes; must match whatever path you mount it at.
      - key: RHINO_CLIENT_SECRET
        value: /etc/secrets/client_secret.json
